<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nebula</title>
<style>
/* Polices locales si le dossier NebulaGui/fonts existe, sinon polices du système. */
@font-face{font-family:Inter;src:url(/fonts/Inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/JetBrainsMono.woff2) format("woff2");font-weight:400 500;font-display:swap}
:root{--bg:#0c0d0f;--panel:#111214;--hover:#17181b;--sel:#1c1e22;--line:#23252a;--line2:#33363d;--txt:#e6e7ea;--dim:#8b8f98;--faint:#5d616b;
  --ok:#46a758;--warn:#e2a336;--bad:#e5484d;--sans:Inter,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono","Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.brand{padding:14px 16px 10px;font-weight:600;font-size:14px;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline}
.brand small{font:11px var(--mono);color:var(--faint);font-weight:400}
aside .filter{margin:0 12px 8px}
nav{overflow:auto;padding:0 8px 12px;flex:1}
nav h3{font-size:11px;font-weight:500;color:var(--faint);margin:14px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
nav a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;color:var(--dim);text-decoration:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a:hover{background:var(--hover);color:var(--txt)} nav a.on{background:var(--sel);color:var(--txt)}
nav a small{font:11px var(--mono);color:var(--faint)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--line);min-height:53px}
.bar h1{font-size:15px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar label{color:var(--dim);display:flex;align-items:center;gap:8px}
.status{font:12px var(--mono);color:var(--dim);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)} .off .status i{background:var(--bad)} .off .status{color:var(--bad)}
#view{flex:1;overflow:auto;padding:22px 24px 40px}
.wrap{max-width:1040px}
input,select,textarea,button{font:13px var(--sans);color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;outline:0}
input,textarea,select{font-family:var(--mono);font-size:12.5px;width:100%}
textarea{min-height:88px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible{border-color:#6e7480;box-shadow:0 0 0 2px #2b2e35}
button{cursor:pointer;background:var(--panel)} button:hover{background:var(--sel);border-color:var(--line2)}
button.primary{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:500} button.primary:hover{background:#fff}
button[disabled]{opacity:.55;cursor:default}
.desc{color:var(--dim);margin:0 0 16px;max-width:70ch}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;margin-bottom:8px}
form .wide{grid-column:1/-1} form label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
.actions{display:flex;align-items:center;gap:12px;margin:14px 0 22px} .actions span{color:var(--dim);font:12px var(--mono)}
.block{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden;background:var(--panel)}
.block>header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-weight:500;font-size:12px;color:var(--dim)}
.block>header button{padding:1px 8px;font-size:11px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
th{text-align:left;font:500 11px var(--sans);color:var(--faint);padding:7px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word;white-space:pre-wrap}
tr:last-child td{border-bottom:0} td.k{color:var(--dim);width:210px;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)} tr.sel td{background:var(--sel)}
pre{margin:0;padding:10px 12px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:480px;overflow:auto}
.notes{list-style:none;margin:0 0 14px;padding:0} .notes li{padding:5px 0 5px 16px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.notes .ok::before{background:var(--ok)} .notes .warn::before{background:var(--warn)} .notes .bad::before{background:var(--bad)} .notes .bad{color:#ff8589}
.empty{color:var(--faint);padding:14px 12px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.cell{background:var(--panel);padding:12px 14px} .cell small{color:var(--dim);display:block} .cell b{font:500 20px var(--mono);display:block;margin:2px 0}
.cell .sub{font:12px var(--mono);color:var(--dim)} .meter{height:3px;background:var(--line);border-radius:2px;margin-top:8px} .meter i{display:block;height:100%;background:var(--txt);border-radius:2px;transition:width .4s}
h2{font-size:13px;font-weight:600;margin:0 0 8px}
.st{font:11px var(--mono)} .st.ok{color:var(--ok)} .st.erreur{color:var(--bad)} .st.interrompu,.st.refusé{color:var(--warn)} .st.info{color:var(--dim)}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
#con{height:calc(100vh - 190px);min-height:240px;max-height:none} .prompt{display:flex;gap:8px;align-items:center;margin-top:10px;font-family:var(--mono);color:var(--dim)}
.p{color:var(--dim)} .e{color:#ff8589}
.live{color:var(--dim);max-height:320px;overflow:auto;border:1px dashed var(--line2);border-radius:8px;margin:0 0 14px}
#lost{display:none;background:#2a1215;border-bottom:1px solid #5c1d22;color:#ffb3b6;padding:8px 24px} .off #lost{display:block}
/* Accent = couleur du thème du terminal (theme <nom>) ; les statuts gardent vert / ambre / rouge. */
:root{--acc:#e6e7ea} .brand{color:var(--acc)} nav a.on{box-shadow:inset 2px 0 0 var(--acc)}
input:focus,select:focus,textarea:focus{border-color:var(--acc)} .msg.user{border-color:var(--acc)} .md .mdh{color:var(--acc)}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px;max-height:calc(100vh - 330px);min-height:220px;overflow:auto}
.msg{white-space:pre-wrap;word-break:break-word;max-width:80ch} .msg b{display:block;font-size:11px;color:var(--faint);font-weight:500;margin-bottom:2px}
.msg.user{align-self:flex-end;background:var(--sel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.step{font:12px var(--mono);color:var(--dim);cursor:pointer} .step code{color:var(--txt)} .step pre{border:1px solid var(--line);border-radius:6px;margin-top:6px;max-height:260px}
.md{white-space:normal} .md div:empty{height:.6em} .md .mdh{font-weight:600;margin-top:4px} .md code{font:12px var(--mono);background:var(--sel);padding:0 4px;border-radius:4px}
.msg.err{color:#ff8589} .msg.find{border-left:2px solid var(--warn);padding-left:10px} .msg.find.critique,.msg.find.haute{border-color:var(--bad)}
.pending{border:1px solid var(--warn);border-radius:8px;padding:12px;margin-bottom:14px} .pending code{font:12.5px var(--mono)} .pending .actions{margin:10px 0 0}
.check{display:flex;align-items:center;gap:8px;color:var(--dim)} .check input{width:auto}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#2a2c31;border-radius:6px;border:2px solid var(--bg)}
@media(max-width:820px){#app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}.cols{grid-template-columns:1fr}html,body{height:auto}#con{height:50vh}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">Nebula <small id="who"></small></div>
    <input class="filter" id="filter" placeholder="Filtrer les outils   Ctrl K" spellcheck="false" style="width:auto" aria-label="Filtrer les outils">
    <nav id="nav"></nav>
  </aside>
  <main>
    <div id="lost">Connexion perdue : le terminal Nebula est fermé. Relancez nebulaGui.</div>
    <div class="bar"><h1 id="title"></h1>
      <span class="status" id="mission" hidden></span>
      <label>Cible <input id="target" placeholder="domaine ou IP" spellcheck="false" style="width:220px"></label>
      <span class="status"><i></i><span id="live">connecté</span></span></div>
    <div id="view"></div>
  </main>
</div>

<script>
const $=id=>document.getElementById(id), TOKEN=new URLSearchParams(location.search).get("t")||"";
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const api=(path,body)=>fetch(path,{method:body?"POST":"GET",headers:{"X-Nebula-Token":TOKEN,"Content-Type":"application/json"},
  body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
let busy=0, state={sys:{},top:[]}, tools=[], commands=[], events=[], since=0, results={}, forms={}, conLog=[], hist=[], hpos=0, page="", selEvent=null;

const fmtB=b=>b>1048576?(b/1048576).toFixed(1)+" Mo/s":b>1024?Math.round(b/1024)+" ko/s":(b||0)+" o/s";
const fmtT=s=>[s/3600|0,s/60%60|0,s%60|0].map(n=>String(n).padStart(2,"0")).join(":");
const hhmm=t=>new Date(t*1000).toLocaleTimeString();
const copy=(text,btn)=>navigator.clipboard.writeText(text).then(()=>{btn.textContent="copié";setTimeout(()=>btn.textContent="copier",1200)});

// ---------- rendu des blocs de résultat ----------
function block(b){
  if(b.notes){const ul=el("ul","notes");b.notes.forEach(([lvl,t])=>ul.append(el("li",lvl,t)));return ul}
  const box=el("div","block"), head=el("header",null,b.title||"Résultat"), btn=el("button",null,"copier");head.append(btn);box.append(head);
  if(b.text!=null){box.append(el("pre",null,b.text||"(vide)"));btn.onclick=()=>copy(b.text,btn);return box}
  const rows=b.kv||b.rows, t=el("table");
  if(b.cols){const tr=el("tr");b.cols.forEach(c=>tr.append(el("th",null,c)));t.append(tr)}
  rows.forEach(r=>{const tr=el("tr");r.forEach((c,i)=>tr.append(el("td",b.kv&&i===0?"k":null,c)));t.append(tr)});
  box.append(rows.length?t:el("div","empty","Aucun résultat."));btn.onclick=()=>copy(rows.map(r=>r.join("\t")).join("\n"),btn);return box}
function renderEvent(e,into){into.replaceChildren();
  const blocks=e.blocks||[{title:"Sortie",text:e.detail||"(aucune sortie)"}];blocks.forEach(b=>into.append(block(b)))}

// ---------- navigation ----------
function buildNav(){const q=$("filter").value.toLowerCase(), nav=$("nav"), link=(id,label,hint)=>{const a=el("a",page===id?"on":null,label);a.tabIndex=0;
    if(hint)a.append(el("small",null,hint));a.onclick=()=>go(id);a.onkeydown=e=>{if(e.key==="Enter")go(id)};return a};
  nav.replaceChildren();
  if(!q){nav.append(link("ia","Nebula IA",state.ia&&state.ia.busy?"…":""),link("home","Vue d'ensemble"),link("journal","Journal",String(events.length)),link("console","Console"))}
  for(const cat of [...new Set(tools.map(t=>t.cat))]){const list=tools.filter(t=>t.cat===cat&&(t.label+t.id+t.desc).toLowerCase().includes(q));
    if(list.length){nav.append(el("h3",null,cat));list.forEach(t=>nav.append(link("tool:"+t.id,t.label,t.id)))}}
  const ids=new Set(tools.map(t=>t.id)), rest=commands.filter(c=>!ids.has(c.name)&&(c.name+c.summary).toLowerCase().includes(q));
  if(rest.length){nav.append(el("h3",null,"Autres commandes"));rest.forEach(c=>nav.append(link("cmd:"+c.name,c.name,c.blocked?"terminal":"")))}}
function go(id){location.hash=id}
addEventListener("hashchange",render);

// ---------- pages ----------
function render(){page=decodeURIComponent(location.hash.slice(1))||"home";const v=el("div","wrap");$("view").replaceChildren(v);buildNav();
  if(page==="ia")iaPage(v);else if(page==="home")home(v);else if(page==="journal")journal(v);else if(page==="console")consolePage(v);
  else if(page.startsWith("tool:"))toolPage(v,tools.find(t=>t.id===page.slice(5)));
  else if(page.startsWith("cmd:"))cmdPage(v,commands.find(c=>c.name===page.slice(4)));else go("home")}

function eventTable(list,onPick){const t=el("table"), tr=el("tr");["Heure","Source","Commande","Durée","Statut"].forEach(c=>tr.append(el("th",null,c)));t.append(tr);
  list.forEach(e=>{const r=el("tr","click"+(selEvent===e.id?" sel":""));r.append(el("td",null,hhmm(e.time)),el("td",null,e.source),el("td",null,e.title),el("td",null,e.duration?e.duration+" s":""),el("td","st "+e.status,e.status));
    r.onclick=()=>onPick(e);t.append(r)});return t}

function home(v){$("title").textContent="Vue d'ensemble";const s=state.sys, cells=el("div","cells");
  const cell=(label,big,sub,pct)=>{const c=el("div","cell");c.append(el("small",null,label),el("b",null,big),el("span","sub",sub));
    if(pct!=null){const m=el("div","meter"),i=el("i");i.style.width=Math.min(pct,100)+"%";if(pct>85)i.style.background="var(--bad)";m.append(i);c.append(m)}return c};
  cells.append(cell("Processeur",Math.round(s.cpu||0)+" %",(s.procs||0)+" processus",s.cpu||0),cell("Mémoire",Math.round(s.ram||0)+" %",`${s.ram_used||0} / ${s.ram_total||0} Go`,s.ram||0),
    cell("Réseau","↓ "+fmtB(s.down),"↑ "+fmtB(s.up)),cell("Session",fmtT(state.uptime||0),`${state.count||0} commandes · ${state.path||""}`));
  const cols=el("div","cols"), left=el("div"), right=el("div"), box=el("div","block"), box2=el("div","block");
  left.append(el("h2",null,"Activité récente"));box.append(events.length?eventTable(events.slice(0,10),e=>{selEvent=e.id;go("journal")}):el("div","empty","Aucune commande pour l'instant. Tapez-en une dans le terminal ou lancez un outil."));left.append(box);
  right.append(el("h2",null,"Commandes les plus utilisées"));const t=el("table");(state.top||[]).forEach(([n,c])=>{const r=el("tr");r.append(el("td",null,n),el("td","k",c+" fois"));t.append(r)});
  box2.append(state.top&&state.top.length?t:el("div","empty","Pas encore d'historique."));right.append(box2);cols.append(left,right);v.append(cells,cols)}

function journal(v){$("title").textContent="Journal";const cols=el("div","cols"), left=el("div","block"), right=el("div");
  const pick=e=>{selEvent=e.id;render()};left.append(events.length?eventTable(events,pick):el("div","empty","Le journal est vide."));
  const cur=events.find(e=>e.id===selEvent);if(cur){right.append(el("h2",null,cur.title));renderEvent(cur,right.appendChild(el("div")))}
  else right.append(el("p","desc","Cliquez une ligne pour revoir son résultat."));cols.append(left,right);v.append(cols)}

function toolPage(v,tool){if(!tool)return go("home");$("title").textContent=tool.label;v.append(el("p","desc",tool.desc));
  const form=el("form"), saved=forms[tool.id]||{}, out=el("div"), info=el("span"), btn=el("button","primary","Lancer");btn.type="submit";
  tool.fields.forEach(f=>{const w=el("div",f.multiline?"wide":null), id="f-"+f.name;let i;
    if(f.options){i=el("select");f.options.forEach(o=>{const op=el("option",null,o||"tous");op.value=o;i.append(op)})}
    else{i=el(f.multiline?"textarea":"input");i.placeholder=f.placeholder||"";if(f.secret)i.type="password";i.spellcheck=false}
    i.id=id;i.name=f.name;i.required=!!f.required;i.value=saved[f.name]??(f.target?$("target").value:"")??"";if(f.options&&!i.value)i.value=f.options[0];
    const l=el("label",null,f.label);l.htmlFor=id;w.append(l,i);form.append(w)});
  const act=el("div","actions wide");act.append(btn,info);form.append(act);
  form.onsubmit=async ev=>{ev.preventDefault();const args=Object.fromEntries(new FormData(form));
    forms[tool.id]=Object.fromEntries(tool.fields.filter(f=>!f.secret).map(f=>[f.name,args[f.name]]));
    btn.disabled=true;btn.textContent="En cours…";info.textContent="";busy++;
    const lv=el("pre","block live");lv.textContent="Démarrage…";out.replaceChildren(lv);
    try{const e=await api("/api/tool",{id:tool.id,args});addEvents([e]);results[tool.id]=e;if(page==="tool:"+tool.id)show(e)}
    catch(err){info.textContent="Impossible de joindre le terminal."}
    busy--;btn.disabled=false;btn.textContent="Lancer"};
  const show=e=>{info.textContent=`${hhmm(e.time)} · ${e.duration} s · ${e.status}`;renderEvent(e,out)};
  v.append(form,out);if(results[tool.id])show(results[tool.id]);const first=form.querySelector("input:placeholder-shown,textarea");if(first)first.focus()}

function cmdPage(v,c){if(!c)return go("home");$("title").textContent=c.name;v.append(el("p","desc",c.summary));
  const b=el("div","block");b.append(el("header",null,"Aide"),el("pre",null,c.help||c.summary));v.append(b);
  if(c.blocked){v.append(el("p","desc","Cette commande est interactive ou ouvre sa propre fenêtre : lancez-la dans le terminal Nebula."));return}
  const btn=el("button","primary","Ouvrir dans la console");btn.onclick=()=>{go("console");setTimeout(()=>{const i=$("cmd");i.value=c.name+" ";i.focus()},0)};v.append(btn)}

function consolePage(v){$("title").textContent="Console";v.style.maxWidth="none";const pre=el("pre"), box=el("div","block"), line=el("div","prompt"), i=el("input");
  pre.id="con";conLog.forEach(([t,c])=>pre.append(el("span",c,t+"\n")));box.append(pre);i.id="cmd";i.placeholder="commande Nebula   (Tab complète, ↑↓ historique)";i.spellcheck=false;i.autocomplete="off";
  line.append(el("span",null,"$"),i);v.append(box,line);pre.scrollTop=1e9;i.focus();
  i.onkeydown=e=>{if(e.key==="Enter"){runCmd(i.value);i.value=""}
    else if(e.key==="ArrowUp"&&hpos>0){i.value=hist[--hpos];e.preventDefault()}
    else if(e.key==="ArrowDown"){hpos=Math.min(hpos+1,hist.length);i.value=hist[hpos]||"";e.preventDefault()}
    else if(e.key==="Tab"){e.preventDefault();const m=commands.filter(c=>c.name.startsWith(i.value));if(m.length===1)i.value=m[0].name+" ";else if(m.length)log(m.map(c=>c.name).join("  "),"p")}}}
function log(text,cls){conLog.push([text,cls||""]);if(conLog.length>400)conLog.shift();const pre=$("con");if(pre){pre.append(el("span",cls,text+"\n"));pre.scrollTop=1e9}}
async function runCmd(cmd){cmd=cmd.trim();if(!cmd)return;if(cmd==="clear"){conLog=[];$("con").replaceChildren();return}
  hist.push(cmd);hpos=hist.length;log("$ "+cmd,"p");busy++;
  const lv=el("pre","live");lv.textContent="…";$("con")&&$("con").after(lv);
  try{const e=await api("/api/run",{cmd});lv.remove();addEvents([e]);log(e.detail||"(aucune sortie)",e.status==="ok"?"":"e")}catch(err){lv.remove();log("Impossible de joindre le terminal.","e")}
  busy--}

// ---------- Nebula IA (même conversation que la commande ia du terminal) ----------
let iaRev=-1, iaOpen={};
// Markdown minimal (titres, listes, **gras**, `code`) construit en DOM : jamais d'innerHTML, la réponse peut citer la cible.
function md(text){const box=el("div","md");text.split("\n").forEach(line=>{const h=/^#{1,4}\s/.test(line), li=/^\s*[-*]\s/.test(line), p=el("div",h?"mdh":null);
  if(li)p.append("• ");line.replace(/^#{1,4}\s+|^\s*[-*]\s+/,"").split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(t=>{
    if(/^\*\*.+\*\*$/.test(t))p.append(el("strong",null,t.slice(2,-2)));else if(/^`.+`$/.test(t))p.append(el("code",null,t.slice(1,-1)));else if(t)p.append(t)});box.append(p)});return box}
function iaPage(v){$("title").textContent="Nebula IA";v.style.maxWidth="900px";const ia=state.ia;iaRev=-1;
  v.append(el("p","desc","Copilote de pentest : il lance les outils Nebula, lit les résultats et relève les faiblesses. Les commandes réseau attendent votre accord (sauf autopilote, possible seulement dans une mission ouverte, dont le périmètre reste imposé par le terminal). Chacune de ses actions va au registre de la mission."));
  const form=el("form"), prov=el("select"), model=el("input"), key=el("input"), auto=el("input"), apply=el("button",null,"Appliquer"), reset=el("button",null,"Nouvelle conversation");
  ia.providers.forEach(p=>{const o=el("option",null,p.name+(p.ready?"":"  (clé manquante)"));o.value=p.name;prov.append(o)});prov.value=ia.provider;
  const syncModel=()=>{const p=ia.providers.find(x=>x.name===prov.value);model.value=p.model;key.disabled=!p.key;key.placeholder=p.key?(p.ready?"déjà enregistrée":p.key):"locale, sans clé"};
  prov.onchange=syncModel;syncModel();key.type="password";auto.type="checkbox";auto.checked=ia.auto;
  const f=(label,input)=>{const w=el("div"),l=el("label",null,label);w.append(l,input);return w};
  const chk=el("label","check");chk.append(auto,"Autopilote (mission)");
  const act=el("div","actions wide");act.append(apply,reset,chk);form.append(f("Fournisseur",prov),f("Modèle",model),f("Clé API",key),act);
  apply.type="submit";form.onsubmit=async e=>{e.preventDefault();const r=await api("/api/ia/config",{provider:prov.value,model:model.value.trim(),key:key.value.trim(),auto:auto.checked});
    key.value="";if(r.error){alert(r.error);auto.checked=state.ia.auto}await tick()};
  reset.type="button";reset.onclick=async()=>{await api("/api/ia/config",{reset:true});await tick()};
  const box=el("div","block"), chat=el("div","chat"), pend=el("div"), ta=el("textarea"), send=el("button","primary","Envoyer"), row=el("div","actions");
  chat.id="iachat";pend.id="iapend";send.id="iasend";box.append(chat);ta.id="iamsg";ta.placeholder="Ex. : audite la configuration TLS et les en-têtes de example.com   (Entrée envoie, Maj+Entrée = nouvelle ligne)";ta.style.minHeight="64px";
  const go2=async()=>{const t=ta.value.trim();if(!t||state.ia.busy)return;ta.value="";const r=await api("/api/ia",{message:t});if(r.error)alert(r.error);await tick()};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go2()}};send.onclick=go2;
  const hint=el("span",null,""), stop=el("button",null,"Stop");hint.id="iahint";stop.id="iastop";stop.hidden=true;
  stop.onclick=async()=>{stop.disabled=true;await api("/api/ia/stop",{});await tick();stop.disabled=false};
  row.append(send,el("button",null,"Expliquer la dernière commande"),stop,hint);
  // Playbooks : audit complet enchaîné par l'IA, seulement dans une mission (le périmètre est vérifié côté terminal)
  const pb=el("form"), pbSel=el("select"), pbTarget=el("input"), pbGo=el("button",null,"Lancer le playbook");
  Object.entries(state.playbooks||{}).forEach(([k,label])=>{const o=el("option",null,label);o.value=k;pbSel.append(o)});
  pbTarget.value=$("target").value;pbTarget.placeholder="cible du périmètre";pbTarget.spellcheck=false;pbGo.type="submit";
  pb.append(f("Playbook",pbSel),f("Cible",pbTarget));const pbAct=el("div","actions");pbAct.append(pbGo,el("span",null,state.mission?"Mission : "+state.mission.name:"Ouvrez d'abord une mission (mission new <nom> <cible>)"));pb.append(pbAct);
  pbGo.disabled=!state.mission;pb.onsubmit=async e=>{e.preventDefault();if(state.ia.busy)return;const r=await api("/api/ia",{playbook:pbSel.value,target:pbTarget.value.trim()});if(r.error)alert(r.error);await tick()};
  row.children[1].onclick=()=>{const e=events.find(x=>x.source!=="ia"&&x.source!=="système"&&!/^(ia|nebula_ia)/.test(x.title));if(!e)return alert("Aucune commande à expliquer.");
    const out=e.blocks?JSON.stringify(e.blocks):e.detail;ta.value=`Explique le résultat de la commande \`${e.title}\` (statut : ${e.status}) : ce qui est important, les risques, la prochaine étape.
<sortie_commande>
${(out||"").slice(-6000)}
</sortie_commande>`;go2()};
  form.style.marginBottom="14px";pb.style.marginBottom="14px";v.append(form,pb,pend,box,ta,row);updateIa();ta.focus()}
function updateIa(){const ia=state.ia, chat=$("iachat");if(!chat||!ia)return;
  $("iasend").disabled=ia.busy;$("iastop").hidden=!ia.busy;$("iahint").textContent=ia.busy?"Nebula IA travaille…":`${ia.provider} · ${ia.model}${ia.autopilot?" · autopilote":""}`;
  if(ia.rev===iaRev)return;iaRev=ia.rev;const pend=$("iapend");pend.replaceChildren();
  if(ia.pending){const p=el("div","pending"), a=el("div","actions"), yes=el("button","primary","Autoriser"), no=el("button",null,"Refuser");
    p.append(el("div",null,"Nebula IA veut lancer ("+ia.pending.reason+") :"),el("code",null,ia.pending.command),el("p","desc",ia.pending.why||""));
    const answer=ok=>async()=>{yes.disabled=no.disabled=true;await api("/api/ia/approve",{id:ia.pending.id,ok});await tick()};yes.onclick=answer(true);no.onclick=answer(false);a.append(yes,no);p.append(a);pend.append(p)}
  chat.replaceChildren();if(!ia.log.length)chat.append(el("div","empty","Posez une question ou demandez un audit. Ex. : « que révèlent les en-têtes HTTP de ma cible ? »"));
  ia.log.forEach((m,i)=>{let d;
    if(m.kind==="user"){d=el("div","msg user",m.text)}
    else if(m.kind==="assistant"){d=el("div","msg");d.append(el("b",null,"Nebula IA"),md(m.text))}
    else if(m.kind==="tool"){d=el("div","step");const code=el("code",null,"$ "+m.text);d.append(code," ",el("span","st "+(m.status==="ok"?"ok":m.status==="en cours"?"info":m.status==="erreur"?"erreur":"refusé"),m.status),m.duration!=null?` · ${m.duration} s`:"",m.why?" — "+m.why:"");
      if(m.output!=null){const key=m.time+m.text;d.title="Cliquer pour voir la sortie";if(iaOpen[key])d.append(el("pre",null,m.output||"(aucune sortie)"));d.onclick=()=>{iaOpen[key]=!iaOpen[key];iaRev=-1;updateIa()}}}
    else if(m.kind==="finding"){d=el("div","msg find "+(m.finding&&m.finding.severity||""));d.append(el("b",null,"Constat"),m.text+(m.finding?"\nPreuve : "+m.finding.evidence+"\nCorrection : "+m.finding.recommendation:""))}
    else if(m.kind==="thinking"){d=el("div","step","… "+m.text+" réfléchit")}
    else d=el("div","msg err",m.text);chat.append(d)});chat.scrollTop=1e9}

// ---------- données en direct ----------
function addEvents(list){let added=false;for(const e of list){since=Math.max(since,e.id);if(!events.some(x=>x.id===e.id)){events.unshift(e);added=true}}
  events.sort((a,b)=>b.id-a.id);events.length=Math.min(events.length,300);return added}
async function tick(first){try{const s=await api(`/api/state?since=${since}${first?"&full=1":""}`);state=s;if(s.accent)document.documentElement.style.setProperty("--acc",s.accent);document.body.classList.remove("off");$("live").textContent="connecté";
    $("mission").hidden=!s.mission;if(s.mission){$("mission").textContent="mission : "+s.mission.name;$("mission").title="Périmètre : "+s.mission.scope.join(", ")}
    if(s.commands){commands=s.commands;tools=s.tools;$("who").textContent=s.user+"@"+s.host}
    if(s.running)document.querySelectorAll(".live").forEach(p=>{p.textContent=`${s.running.title} — en cours depuis ${s.running.elapsed} s\n\n${s.running.output||""}`;p.scrollTop=1e9});
    if(page==="ia")updateIa();const added=addEvents(s.events);if(first)render();else if(page==="home"||(added&&page==="journal"))render();else if(added)buildNav()}
  catch(err){document.body.classList.add("off");$("live").textContent="hors ligne"}
  clearTimeout(tickT);tickT=setTimeout(tick,first||busy||(state.ia&&state.ia.busy)?700:2000)}
let tickT=0;

$("target").value=localStorage.getItem("nebula-target")||"";
$("target").oninput=e=>localStorage.setItem("nebula-target",e.target.value.trim());
$("filter").oninput=buildNav;
$("filter").onkeydown=e=>{if(e.key==="Enter"){const a=$("nav").querySelector("a");if(a){$("filter").value="";a.click()}}};
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("filter").select()}});
tick(true);
</script>
